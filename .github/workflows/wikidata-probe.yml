# Temporary: checks what Wikidata knows of French film awards, shown in the
# job annotations.
name: Sonde Wikidata

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/wikidata-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger Wikidata
        run: |
          ask() {
            code=$(curl -sS -m 60 -o body.json -w '%{http_code}' -G 'https://query.wikidata.org/sparql' \
              -H 'Accept: application/sparql-results+json' -A 'Moonfin-perso/1.0 (personal app)' \
              --data-urlencode "query=$2")
            echo "::notice title=$1::HTTP $code $(jq -c "$3" body.json 2>/dev/null | head -c 3000)"
          }
          ask awards 'SELECT ?award ?label WHERE { VALUES ?label { "César du meilleur film"@fr "Palme d'"'"'or"@fr "prix Louis-Delluc"@fr "César du meilleur premier film"@fr "Grand prix"@fr "Lion d'"'"'or"@fr "Ours d'"'"'or"@fr } ?award rdfs:label ?label . }' '[.results.bindings[] | {a: .award.value, l: .label.value}]'
          ask winners 'SELECT ?tmdb ?filmLabel ?awardLabel ?year WHERE { VALUES ?awardLabelFr { "César du meilleur film"@fr "Palme d'"'"'or"@fr "prix Louis-Delluc"@fr "César du meilleur premier film"@fr } ?award rdfs:label ?awardLabelFr . ?film p:P166 ?st . ?st ps:P166 ?award . OPTIONAL { ?st pq:P585 ?date . BIND(YEAR(?date) AS ?year) } ?film wdt:P4947 ?tmdb . SERVICE wikibase:label { bd:serviceParam wikibase:language "fr". } } ORDER BY DESC(?year) LIMIT 25' '[.results.bindings[] | [.tmdb.value, .filmLabel.value, .awardLabel.value, .year.value]]'
          ask count 'SELECT (COUNT(DISTINCT ?film) AS ?n) WHERE { VALUES ?awardLabelFr { "César du meilleur film"@fr "Palme d'"'"'or"@fr "prix Louis-Delluc"@fr "César du meilleur premier film"@fr } ?award rdfs:label ?awardLabelFr . ?film wdt:P166 ?award . ?film wdt:P4947 ?tmdb . }' '.results.bindings'
