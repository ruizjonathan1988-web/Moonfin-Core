# Temporary: finds TMDB ids on Wikidata, shown in the job annotations.
name: Sonde Wikidata

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/wikidata-probe.yml', '.github/probe/**']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/tmdb_ids.py
