# Temporary: checks a Trakt Client ID against the live API and shows the shape
# of its answers in the job annotations.
name: Sonde Trakt

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/trakt-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger Trakt
        env:
          KEY: TCAqoSzejS8EETqVZUEc3c0RhsSgxYcM-HYt0_vcHpE
        run: |
          call() {
            code=$(curl -sS -m 20 -o body.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'trakt-api-version: 2' \
              -H "trakt-api-key: $KEY" \
              -A 'Moonfin-perso' "$2" "${@:3}")
            echo "::notice title=$1::HTTP $code $(head -c 420 body.json | tr '\n' ' ')"
          }
          call movies-watched 'https://api.trakt.tv/movies/watched/weekly?limit=2'
          call shows-watched 'https://api.trakt.tv/shows/watched/weekly?limit=2'
          call movies-trending 'https://api.trakt.tv/movies/trending?limit=2'
          call shows-trending 'https://api.trakt.tv/shows/trending?limit=2'
          call device-code 'https://api.trakt.tv/oauth/device/code' -X POST -d "{\"client_id\":\"$KEY\"}"
