# Temporary: checks whether Trakt links an account by code without a client
# secret, shown in the job annotations.
name: Sonde Trakt

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/trakt-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger Trakt
        env:
          KEY: TCAqoSzejS8EETqVZUEc3c0RhsSgxYcM-HYt0_vcHpE
        run: |
          call() {
            code=$(curl -sS -m 20 -o body.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'trakt-api-version: 2' \
              -H "trakt-api-key: $KEY" \
              -A 'Moonfin-perso' -X POST -d "$3" "$2")
            echo "::notice title=$1::HTTP $code $(head -c 400 body.json | tr '\n' ' ')"
          }
          call device-code https://api.trakt.tv/oauth/device/code "{\"client_id\":\"$KEY\"}"
          DC=$(jq -r .device_code body.json)
          call token-nosecret https://api.trakt.tv/oauth/device/token "{\"code\":\"$DC\",\"client_id\":\"$KEY\"}"
          call token-badsecret https://api.trakt.tv/oauth/device/token "{\"code\":\"$DC\",\"client_id\":\"$KEY\",\"client_secret\":\"bogus\"}"
          call token-badcode https://api.trakt.tv/oauth/device/token "{\"code\":\"nope\",\"client_id\":\"$KEY\"}"
          call refresh-nosecret https://api.trakt.tv/oauth/token "{\"refresh_token\":\"bogus\",\"client_id\":\"$KEY\",\"grant_type\":\"refresh_token\",\"redirect_uri\":\"http://localhost\"}"
          call refresh-noredirect https://api.trakt.tv/oauth/token "{\"refresh_token\":\"bogus\",\"client_id\":\"$KEY\",\"grant_type\":\"refresh_token\"}"
          call refresh-badsecret https://api.trakt.tv/oauth/token "{\"refresh_token\":\"bogus\",\"client_id\":\"$KEY\",\"client_secret\":\"bogus\",\"grant_type\":\"refresh_token\",\"redirect_uri\":\"http://localhost\"}"
