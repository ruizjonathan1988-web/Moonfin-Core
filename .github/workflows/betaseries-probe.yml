# Temporary: checks a BetaSeries API key against the live API and shows the
# shape of its answers in the job annotations.
name: Sonde BetaSeries

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/betaseries-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger BetaSeries
        env:
          KEY: '09fe278bf39e'
        run: |
          call() {
            code=$(curl -sS -m 20 -o body.json -w '%{http_code}' \
              -H "X-BetaSeries-Key: $KEY" \
              -H 'X-BetaSeries-Version: 3.0' \
              -A 'Moonfin-perso' "$2")
            echo "::notice title=$1::HTTP $code $(head -c "${3:-700}" body.json | tr '\n' ' ')"
          }
          call rank-type-all 'https://api.betaseries.com/stats/shows_ranking?type=all&limit=3' 500
          call rank-genre-all 'https://api.betaseries.com/stats/shows_ranking?genre=all&limit=3' 500
          call rank-both 'https://api.betaseries.com/stats/shows_ranking?type=all&genre=all&limit=3' 500
          call rank-30d 'https://api.betaseries.com/stats/shows_ranking?period=30&limit=10' 1500
          call show-display 'https://api.betaseries.com/shows/display?id=36263' 2500
          call movies-pop10 'https://api.betaseries.com/movies/list?order=popularity&limit=10' 2500
          call movies-alpha 'https://api.betaseries.com/movies/list?order=alphabetical&limit=2' 500
