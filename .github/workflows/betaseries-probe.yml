# Temporary: checks what BetaSeries shares about a member with the app key
# alone, shown in the job annotations.
name: Sonde BetaSeries

on:
  push:
    branches: [perso-wip]
    paths: ['.github/workflows/betaseries-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger BetaSeries
        env:
          KEY: '09fe278bf39e'
        run: |
          call() {
            code=$(curl -sS -m 20 -o body.json -w '%{http_code}' \
              -H "X-BetaSeries-Key: $KEY" \
              -H 'X-BetaSeries-Version: 3.0' \
              -A 'Moonfin-perso' "${@:3}" "$2")
            echo "::notice title=$1::HTTP $code $(head -c 200 body.json | tr -s ' \n' ' ')"
          }
          ID=3466389
          call shows "https://api.betaseries.com/shows/member?id=$ID&limit=10"
          echo "::notice title=shows-user::$(jq -c '[.shows[] | {title, themoviedb_id, user}]' body.json | head -c 3000)"
          call movies-seen "https://api.betaseries.com/movies/member?id=$ID&state=1&limit=40"
          echo "::notice title=movies-user::$(jq -c '{total, movies: [.movies[] | {title, tmdb_id, user}][0:6]}' body.json | head -c 2000)"
          echo "::notice title=movies-count::$(jq -c '[.movies | length, .total]' body.json)"
          call movies-all "https://api.betaseries.com/movies/member?id=$ID&limit=5&state=0"
          echo "::notice title=movies-towatch-user::$(jq -c '[.movies[] | {title, tmdb_id, user}]' body.json | head -c 800)"
          call shows-archived "https://api.betaseries.com/shows/member?id=$ID&status=archived&limit=5"
          echo "::notice title=archived::$(jq -c '[.shows[]? | {title, user}]' body.json | head -c 800)"
